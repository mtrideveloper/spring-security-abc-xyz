spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}            
            scope:
              - openid
              - email
              - profile
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${PASSWORD} #mật khẩu ứng dụng (apppasswords), với tên ứng dụng là: spring-security-abc-xyz
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  recaptcha:
    secret: ${RECAPTCHA_SECRET}