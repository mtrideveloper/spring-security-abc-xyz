<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}"> <!-- ~ là gốc tại templates-->

<head>
    <title>Profile</title>
</head>

<body>
    <div layout:fragment="content">
        <h1 class="text-primary">Xin chào, <span th:text="${name}">Bạn</span></h1>
        <p class="text-primary">Email: <span th:text="${email}"></span></p>
        <div class="py-3">
            <img  th:if="${picture != null}" th:src="@{/proxy-image(url=${picture})}" alt="Profile Picture" style="max-height: 140px; width: auto;">
            <!-- @ la goc tai resources-->
            <img th:if="${picture == null}" th:src="@{/images/noise.jpg}" alt="Profile Picture" style="max-height: 140px; width: auto;">
        </div>
        <div sec:authorize="isAuthenticated()">
            <div th:replace="~{fragments/logout :: logout-button}"></div>
        </div>
    </div>
</body>

</html>
