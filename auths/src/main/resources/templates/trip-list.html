<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">

<head>
    <title>Trip List</title>
</head>

<body>
    <div layout:fragment="content">

        <h2 class="mb-3">Danh sách chuyến đi</h2>

        <!--
        Thymeleaf cung cấp nhiều utility object qua #:
        #lists → hàm xử lý List.
        #strings → xử lý chuỗi (#strings.isEmpty(str), #strings.substring(str,0,5)…).
        #numbers → xử lý số (#numbers.formatDecimal(num,1,2)).
        #dates → xử lý ngày giờ.
        #bools, #maps, #arrays, #temporals (Java 8 time API)…        
        -->
        <div th:if="${#lists.isEmpty(trips)}" class="alert alert-info">
            Bạn chưa có chuyến đi nào.
        </div>

        <div th:unless="${#lists.isEmpty(trips)}">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Tên chuyến đi</th>
                        <th>Ngày bắt đầu</th>
                        <th>Ngày kết thúc</th>
                        <th>Địa điểm</th>
                        <th>Ghi chú</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="trip, stat : ${trips}">
                        <td th:text="${stat.count}"></td>
                        <td th:text="${trip.name}"></td>
                        <td th:text="${#temporals.format(trip.startDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(trip.endDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="${trip.location}"></td>
                        <td th:text="${trip.notes}"></td>
                        <td>
                            <a class="btn btn-sm btn-primary" th:href="@{/trip/{id}(id=${trip.id})}">
                                <i class="fa fa-eye"></i> Xem
                            </a>
                            <a class="btn btn-sm btn-warning" th:href="@{/trip/edit/{id}(id=${trip.id})}">
                                <i class="fa fa-pen"></i> Sửa
                            </a>
                            <a class="btn btn-sm btn-danger" th:href="@{/trip/delete/{id}(id=${trip.id})}"
                                onclick="return confirm('Bạn có chắc muốn xóa?')">
                                <i class="fa fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>

</html>
