<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">

<div sec:authorize="isAuthenticated()">
    <body>
        <div layout:fragment="content">
            <h1 class="text-primary text-center">Để tạm đây thôi, đáng lẽ bạn sẽ bị đá sang trang profile!</h1>
        </div>
    </body>
</div>

<div sec:authorize="!isAuthenticated()">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập - Magic Link</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-success bg-gradient">
        <div class="card p-3 mx-auto mt-5" style="max-width: 400px;">
            <div class="card-body">
                <h2 class="text-center mb-3" th:unless="${token}">Magic Link</h2>
                <div th:if="${token}">
                    <form th:action="${sprOttLoginApi}" method="post">
                        <div class="mb-2">
                            <label for="token" class="form-label">Token</label>
                            <input type="text" class="form-control" id="token" name="token" th:value="${token}" required
                                readonly>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-2">Xác nhận</button>
                    </form>
                </div>
                <div th:unless="${token}">
                    <form th:action="${sprOttGenApi}" method="post">
                        <div th:if="${errorMessage}" class="toast-container position-fixed top-0 end-0 p-3">
                            <div class="toast align-items-center text-white bg-danger border-0" role="alert"
                                aria-live="assertive" aria-atomic="true" id="liveToast">
                                <div class="d-flex">
                                    <div class="toast-body" th:text="${errorMessage}">
                                        Token không hợp lệ <!--Nếu errorMessage null thì dùng text content mặc định-->
                                    </div>
                                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                        data-bs-dismiss="toast" aria-label="Close"></button>
                                </div>
                            </div>
                        </div>
                        <div class="mb-2">
                            <input type="email" class="form-control" id="username" name="username" required
                                placeholder="Nhập email">
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-2">Gửi</button>
                        <p class="text-center mt-2">
                            <a th:href="${loginUrl}" class="text-secondary">Quay lại</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const liveToast = document.getElementById('liveToast');
        if (liveToast) {
            const toast = new bootstrap.Toast(liveToast, {
                autohide: true,
                delay: 5000 // 5000ms = 5 giây
            });
            toast.show(); // Hiển thị toast ngay khi trang tải nếu tồn tại
        }
    });
</script>
</body>
</div>

</html>
