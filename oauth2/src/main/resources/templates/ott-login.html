<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Magic Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div layout:fragment="content">
        <div sec:authorize="isAuthenticated()">
            <h1 class="text-primary text-center">(Tạm thời) Bạn đã đăng nhập rồi!</h1>
        </div>
        <div sec:authorize="!isAuthenticated()">
            <div class="row justify-content-center mt-5">
                <div class="col-md-4">
                    <div class="border border-3 p-4 rounded-top mb-4">
                        <h4 class="mb-4 p-0">
                            <strong th:unless="${token}">Magic Link login</strong>
                            <strong th:if="${token}">Enter your token</strong>
                            <hr>
                        </h4>
                        <div th:if="${token}">
                            <form th:action="${sprOttLoginApi}" method="post">
                                <div class="mb-2">
                                    <label for="token" class="form-label">Token</label>
                                    <input type="text" class="form-control" id="token" name="token" th:value="${token}"
                                        required readonly>
                                </div>
                                <div class="d-grid col-12 pt-3 mx-auto">
                                    <button type="submit" class="btn btn-dark">Xác nhận</button>
                                </div>
                            </form>
                        </div>
                        <div th:unless="${token}">
                            <form th:action="${sprOttGenApi}" method="post">
                                <div th:if="${errorMessage}" class="toast-container position-fixed top-0 end-0 p-3">
                                    <div class="toast align-items-center text-white bg-danger border-0" role="alert"
                                        aria-live="assertive" aria-atomic="true" id="liveToast">
                                        <div class="d-flex">
                                            <div class="toast-body" th:text="${errorMessage}">
                                                Token không hợp lệ
                                                <!--Nếu errorMessage null thì dùng text content mặc định-->
                                            </div>
                                            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                                                data-bs-dismiss="toast" aria-label="Close"></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <input type="email" class="form-control" id="username" name="username" required
                                        placeholder="Nhập email">
                                </div>
                                <div class="d-grid col-12 pt-3 mx-auto">
                                    <button type="submit" class="btn btn-dark">Gửi</button>
                                </div>
                                <p class="text-center d-grid col-4 pt-3 gap-2 mx-auto">
                                    <a th:href="${loginUrl}" class="text-secondary">Quay lại</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <div class="card border border-3 p-4 rounded-top mb-4" style="max-width: 400px;">
                <div class="card-body">

                </div>
            </div> -->
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const liveToast = document.getElementById('liveToast');
            if (liveToast) {
                const toast = new bootstrap.Toast(liveToast, {
                    autohide: true,
                    delay: 5000 // 5000ms = 5 giây
                });
                toast.show(); // Hiển thị toast ngay khi trang tải nếu tồn tại
            }
        });
    </script>
</body>

</html>
