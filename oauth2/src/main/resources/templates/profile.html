<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
    layout:decorate="~{layout/main}">

<head>
    <title>Profile</title>
</head>

<body>
    <div layout:fragment="content">
        <h1 class="text-primary">Xin chào, <span th:text="${name}">Bạn</span></h1>
        <!-- <img th:src="${picture}" class="img-thumbnail" style="width:150; height: 150;"> -->
        <!--::logout-button: chọn fragment có th:fragment="logout-button" trong fragments/logout.html-->
        <div  sec:authorize="isAuthenticated()">
            <div th:replace="fragments/logout :: logout-button"></div>
        </div>
    </div>
</body>

</html>
