<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - MySite">MySite</title>

    <!-- Toàn cục Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/custom.css}">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bd-navbar sticky-top bg-light">
            <button class="navbar-toggler mx-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse pt-2 pt-lg-0" id="navbarSupportedContent">
                <div class="container d-flex justify-content-between flex-column flex-md-row gap-2 gap-md-0">
                    <ul class="navbar-nav">
                        <a class="h-100" href="/">
                            <img th:src="@{/images/dashIcon.png}" style="max-height: 20px; height: 100%; width: auto;">
                        </a>
                        <li class="nav-item dropdown d-flex align-items-center d-none d-lg-block">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                .com
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#">Việt Nam</a></li>
                                <li><a class="dropdown-item" href="#">Vương Quốc Anh</a></li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search players..."
                            aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                    <div class="d-flex justify-content-end justify-content-md-center">
                        <div sec:authorize="!isAuthenticated()">
                            <a class="btn btn-dark mx-1" tabindex="-1" role="button" th:href="@{/login}">
                                <!-- <a class="btn btn-dark mx-1" tabindex="-1" role="button" href="/login"> -->
                                <i class="fa-solid fa-user"></i> Login
                            </a>
                        </div>
                        <div sec:authorize="isAuthenticated()">
                            <a class="h-100" th:href="@{/profile}">
                                <img th:if="${picture != null}" th:src="@{/proxy-image(url=${picture})}" class="img-thumbnail rounded-circle"
                                    style="max-height: 40px; width: auto; aspect-ratio: 1;">
                                <img th:if="${picture == null}" th:src="@{/images/noise.jpg}" class="img-thumbnail rounded-circle"
                                    style="max-height: 40px; width: auto; aspect-ratio: 1;">
                            </a>
                        </div>
                        <!-- <a class="btn btn-info" tabindex="-1" role="button">
                            <i class="fa-solid fa-user-plus" th:href="@{/register}"></i> Register
                        </a> -->
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <!-- Nội dung động của từng trang -->
        <div layout:fragment="content" class="container py-3"></div>
    </main>

    <footer>
        <!-- Footer chung -->
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <th:block layout:fragment="scripts">
        <!-- Script từ các trang con sẽ được chèn vào đây -->
    </th:block>        
</body>

</html>
