<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">

<head>
    <title>Noname</title>
</head>

<body>
    <div layout:fragment="content">
        <h1 class="text-primary text-center">Welcome to the Home Page</h1>
        <!-- Hiển thị thông tin nếu đã đăng nhập -->
        <div sec:authorize="isAuthenticated()">
            <p>Hello, 
                <cite>user authentication code:</cite>
                <strong sec:authentication="name">User</strong>
            </p>
            <!--::logout-button: chọn fragment có th:fragment="logout-button" trong fragments/logout.html-->
            <div th:replace="~{fragments/logout :: logout-button}"></div>
        </div>

        <!-- Hiển thị link đăng nhập nếu chưa đăng nhập -->
        <div sec:authorize="!isAuthenticated()">
            <p>You are not logged in.</p>
        </div>
    </div>
</body>

</html>
